# Maintenance controller uses the approved PAT; draft publication remains separately gated.
# Create examples-maintainer and examples-maintainer-github before applying this Blueprint.
services:
  - type: workflow
    name: examples-maintainer
    runtime: node
    region: oregon
    repo: https://github.com/R4ph-t/examples-maintainer
    branch: feat/repository-maintenance
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run start:maintenance
    envVars:
      - fromGroup: examples-maintainer
      - fromGroup: examples-maintainer-github
      - key: MAINTENANCE_MODE
        value: pat
  - type: cron
    name: examples-maintainer-daily
    runtime: node
    region: oregon
    plan: starter
    repo: https://github.com/R4ph-t/examples-maintainer
    branch: feat/repository-maintenance
    autoDeployTrigger: off
    schedule: "0 3 * * *"
    buildCommand: npm ci
    startCommand: npm run maintenance:dependencies -- --wait
    envVars:
      - fromGroup: examples-maintainer
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: examples-maintainer
          property: slug
  - type: cron
    name: examples-maintainer-scan
    runtime: node
    region: oregon
    plan: starter
    repo: https://github.com/R4ph-t/examples-maintainer
    branch: feat/repository-maintenance
    autoDeployTrigger: off
    schedule: "0 */6 * * *"
    buildCommand: npm ci
    startCommand: npm run maintenance:scan -- --wait
    envVars:
      - fromGroup: examples-maintainer
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: examples-maintainer
          property: slug
